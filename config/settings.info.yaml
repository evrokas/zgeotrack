title: GeoTrack

tz: "Europe/Athens"

meta:
  - charset="UTF-8"
  - http-equiv="X-UA-Compatible" content="IE=edge"
  - name="viewport" content="width=device-width, initial-scale=1.0"

templates:
  - './core/templates/'
  - './templates/'

css:
  - styles:
    src: 'css/styles.css'
  # Vendored locally (web/css/bx/, copied verbatim from zpms's own copy --
  # same LICENSE.txt carried along), not a CDN reference, matching this
  # app's plain-CSS/no-external-runtime-dependency convention. Loaded
  # unconditionally here, exactly how zpms's own settings.info.yaml does
  # it (checked directly -- zpms does NOT reach it via `libraries:`/
  # `attach_library()` despite that being what core's own admin_list.zetem
  # calls; it's simply always in zpms's plain `css:` list, same as this).
  # Needed because core's own webform/admin_crud table row buttons AND
  # core/templates/nav/main_navigation.zetem's hamburger icon hardcode
  # `bx bx-*` classes with no fallback -- confirmed live against this
  # instance: every Edit/Delete button on /devices and the nav toggle
  # rendered as an empty, icon-less clickable element with this missing.
  #
  # A first attempt used a `libraries: boxicons: src: ...` block plus
  # `attach_library('boxicons')` calls in each content template, modeled
  # on a misreading of zpms's config (the `- boxicons:` line under `css:`
  # looked like a separate `libraries:` entry at a glance, but is a plain
  # flat list item of `css:` itself, one indent level up from where it
  # looked). Confirmed the mistake directly: `libraries:` parses to a
  # numerically-indexed list (`[0 => ['boxicons' => null, 'src' => ...]]`)
  # under that shape, not the `['boxicons' => ['css' => [...]]]` shape
  # `attach_library_helper()`'s `array_key_exists($libname, ...)` actually
  # needs -- zpms's own real `libraries:` block (used only for
  # `loader-library`) confirms the genuinely-correct shape is keyed
  # directly by name, one level up from `css:`/`foot_script:`, not a
  # dashed list. Simpler to just match what zpms actually does for
  # boxicons specifically (plain, unconditional `css:` entry) than to
  # build out the more elaborate opt-in shape for a library every
  # authenticated page already needs anyway.
  - boxicons:
    src: 'css/bx/css/boxicons.min.css'

# Single-language deployment -- every string is written directly in the
# .zetem templates rather than routed through t()/a dictionary, so there
# is no per-app translation table to keep in sync (see zpms/erweb for the
# bilingual convention this app deliberately skips).
multilingual: false

languages:
  - en

# Pseudo-roles ("anonymous", "authenticated") plus every real RBAC role
# name this app seeds (bin/setup.php / web/rbac_seed.php) -- SecurityClass::
# userIsPermitted() validates every route/region/modconf `access:` string
# against this exact list, so a role used in one but missing here is a
# fatal ("role is not configured correct"), not a silent deny.
roles:
  anonymous: []
  authenticated: []
  viewer: []
  operator: []
  administrator: []

routes:
  homepage:
    title: "GeoTrack"
    url: "/"
    handler: homepage

  login:
    title: "Sign in"
    url: "/login"
    handler: login
    method: get

  login_post:
    title: "Sign in"
    url: "/login"
    handler: login_post
    method: post

  logout:
    title: "Sign out"
    url: "/logout"
    handler: logout

  profile:
    title: "My account"
    url: "/profile"
    handler: zgt_profile
    access: authenticated

  locations_table:
    title: "Locations"
    url: "/locations"
    handler: zgt_locations_table
    access: authenticated

  devices_list:
    title: "Devices"
    url: "/devices"
    handler: zgt_devices_list
    access: authenticated

  devices_row_edit:
    title: "Edit device"
    url: "/devices/{guid}/edit"
    handler: zgt_devices_row_edit
    method: get
    access: authenticated

  # formsClass::processform()/deleteFormRow() (zeusfw core) have no
  # permission check of their own -- this route-level access: is what
  # actually protects them, same convention as zpms's own webform routes.
  # Every webform this app defines today (just `devices`) is gated on
  # devices-manage internally (zgt_devices_list()/zgt_devices_row_edit()),
  # so `operator` is the right floor here too.
  webforms_post:
    title: "Process form"
    url: "/webform/processform/{guid}"
    handler: formsClass::processform
    method: post
    access: operator administrator

  webforms_view:
    title: "View form"
    url: "/webform/viewform/{formname}"
    handler: formsClass::viewform
    access: operator administrator

  webforms_delete:
    title: "Delete form row"
    url: "/webform/delete/{formname}/{guid}"
    handler: formsClass::deleteFormRow
    method: post
    access: operator administrator

  # Session-authenticated JSON the map page's own JS fetches -- distinct
  # from /api/overland below, which authenticates by device key instead
  # of a login session.
  api_locations_latest:
    title: "Latest locations API"
    url: "/api/locations/latest"
    handler: zgt_api_locations_latest
    method: get
    access: authenticated

  api_locations_track:
    title: "Location track API"
    url: "/api/locations/track/{device_guid}"
    handler: zgt_api_locations_track
    method: get
    access: authenticated

  # Overland iOS's own ingestion endpoint -- authenticated by device_id +
  # key query params (see web/api_overland.php), not a login session, so
  # deliberately no `access:` here.
  overland_ingest:
    title: "Overland ingestion API"
    url: "/api/overland"
    handler: zgt_overland_ingest
    method: post

regions:
  # Same reasoning as zpms's own settings.info.yaml: region-level access:
  # keeps the (logged-out) /login page a standalone page with no chrome,
  # covering any future pre-auth route automatically.
  - header:
      access: authenticated
  - main_navigation:
      access: authenticated
  - notification
  - main_content

structure:
  header:
    - userblock
  main_navigation:
    - mainnavigation
  notification:
    - notifications
  main_content:
    - content

menu:
  main:
    - homepage:
      text: "Map"
      url: '/'
    - locations_table:
      text: "Table"
      url: '/locations'
    - devices_list:
      text: "Devices"
      url: '/devices'
      access: operator administrator
    - users_admin:
      text: "Users & roles"
      url: '/admin/users'
      access: administrator

modules:
  path:
    - "/web/core/modules/"
    - "/web/modules/"
  modules:
    - mainnavigation
    - notifications
    - userblock
    - content
    - admin_crud
